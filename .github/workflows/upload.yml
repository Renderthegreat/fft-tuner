jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          echo "INPUT_PATH: ./dist"
          if [ ! -d ./dist ]; then
            echo "Error: ./dist not found; check build output or path" >&2
            ls -la .
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist